name: Update IPTV Sources

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）自动聚合上游源并测速生成 m3u
    - cron: '0 0 * * *'
  workflow_dispatch:   # 支持在 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aggregate and check upstream sources
        run: python scripts/aggregate.py

      - name: Commit generated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.m3u international.m3u
          if ! git diff --staged --quiet; then
            git commit -m "auto: update IPTV playlists $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
